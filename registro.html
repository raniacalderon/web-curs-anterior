    <main class="contingut">
        <h2 class="titol-seccio">Registro</h2>
        
        <div class="registre-container">
            <form action="#" class="formulari-registre">
                <div class="grup-entrada">
                    <label for="nom-reg">Nombre y Apellidos</label>
                    <input type="text" id="nom-reg" required placeholder="Escribe tu nombre completo">
                </div>

                <div class="grup-entrada">
                    <label for="email-reg">Correo electrónico</label>
                    <input type="email" id="email-reg" required placeholder="ejemplo@gmail.com">
                </div>

                <div class="grup-entrada">
                    <label for="pass">Contraseña</label>
                    <input type="password" id="pass" name="password" required placeholder="Crea una contraseña segura">
                </div>

                <div class="grup-entrada">
                    <label for="pass-conf">Confirmar contraseña</label>
                    <input type="password" id="pass-conf" name="password-confirm" required placeholder="Vuelve a escribir tu contraseña">
                </div>

                <button type="submit" class="btn-principal">Finalizar Registro</button>
            </form>
        </div>
    </main>
