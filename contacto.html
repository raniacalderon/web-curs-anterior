<main class="contingut">
    <h2 class="titol-seccio">Contacta con nosotros</h2>
    
    <div class="contacte-flex">
        <div class="info-caixa">
            <div class="detalls-contacte">
                <p><i class="fas fa-map-marker-alt"></i> Calle de la Cultura, 123, Lleida</p>
                <p><i class="fas fa-phone"></i> +34 123 123 123</p>
                <p><i class="fas fa-envelope"></i> info@marenostrum.com</p>
            </div>
            <div class="mapa">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d6207.224837179915!2d0.6209328760444833!3d41.60825328226644!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x12a6e072643badf3%3A0xcc39288a1df2a443!2sEscuela%20Polit%C3%A9cnica%20Superior%20de%20la%20Universidad%20de%20Lleida!5e1!3m2!1ses!2ses!4v1775819683798!5m2!1ses!2ses" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
            </div>
        </div>

        <div class="formulari-caixa">
            <form id="contacto-form" action="#">
                <div class="grup-entrada">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre..." required>
                </div>
                <div class="grup-entrada">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email-reg" name="email" placeholder="correo@gmail.com" required>
                </div>
                <div class="grup-entrada">
                    <label for="asunto">Asunto</label>
                    <input type="text" id="asunto" name="asunto" placeholder="Motivo del mensaje">
                </div>
                <div class="grup-entrada">
                    <label for="missatge">Mensaje</label>
                    <textarea id="missatge" name="missatge" rows="5" placeholder="Escribe aquí tus consultas..."></textarea>
                </div>
                <button type="submit" class="btn-principal">Enviar mensaje</button>
            </form>
        </div>
    </div> 
</main>
